<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Wardrobe</title>
  <link rel="stylesheet" href="/assets/css/virtual-wardrobe.css">
</head>

<body>
  <div id="header-placeholder"></div>

  <!-- Wardrobe Content -->
  <div id="wardrobe-root">
    <div class="wardrobe-container">
      <!-- Header -->
      <div class="wardrobe-header">
        <h1 class="wardrobe-title">My Wardrobe</h1>
        <p class="wardrobe-subtitle">Organize and manage your clothing collection</p>
      </div>

      <!-- View Mode Toggle -->
      <div class="view-toggle">
        <button id="items-view-btn" class="view-btn active">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
          Items
        </button>
        <button id="outfits-view-btn" class="view-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
          Outfits
        </button>
      </div>

      <!-- Search and Filter Bar -->
      <div class="search-bar liquid-container">
        <div class="search-controls">
          <input id="search-input" class="liquid-input" type="text" placeholder="Search wardrobe items...">
          <select id="category-filter" class="liquid-select">
            <option value="all">All Categories</option>
            <option value="tops">Tops</option>
            <option value="bottoms">Bottoms</option>
            <option value="dresses">Dresses</option>
            <option value="outerwear">Outerwear</option>
            <option value="shoes">Shoes</option>
            <option value="accessories">Accessories</option>
          </select>
          <button id="add-item-btn" class="liquid-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            Add Item
          </button>
        </div>
      </div>

      <!-- Items Grid -->
      <div id="items-view" class="items-grid"></div>

      <!-- Outfits Grid -->
      <div id="outfits-view" class="outfits-grid hidden"></div>

      <!-- Item Details Modal -->
  <div id="item-details-modal" class="modal-overlay hidden">
    <div class="modal-content item-details-modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="details-modal-title">Item Details</h2>
        <button id="close-details-modal-btn" class="close-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      
      <div class="details-modal-body">
        <div class="details-image-wrapper">
          <img id="details-modal-image" src="" alt="Item" class="details-modal-img" />
        </div>
        
        <!-- View Mode -->
        <div id="details-view-mode" class="details-info">
          <div class="details-row">
            <span class="details-label">Name:</span>
            <span class="details-value" id="view-name">-</span>
          </div>
          <div class="details-row">
            <span class="details-label">Category:</span>
            <span class="details-value" id="view-category">-</span>
          </div>
          <div class="details-row">
            <span class="details-label">Brand:</span>
            <span class="details-value" id="view-brand">-</span>
          </div>
          <div class="details-row">
            <span class="details-label">Color:</span>
            <span class="details-value" id="view-color">-</span>
          </div>
          <div class="details-row">
            <span class="details-label">Size:</span>
            <span class="details-value" id="view-size">-</span>
          </div>
          <div class="details-row">
            <span class="details-label">Price:</span>
            <span class="details-value" id="view-price">-</span>
          </div>
          <div class="details-row">
            <span class="details-label">Material:</span>
            <span class="details-value" id="view-material">-</span>
          </div>
        </div>
        
        <!-- Edit Mode -->
        <div id="details-edit-mode" class="details-info hidden">
          <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" id="edit-name" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="edit-category" class="form-select">
              <option value="tops">Tops</option>
              <option value="bottoms">Bottoms</option>
              <option value="dresses">Dresses</option>
              <option value="outerwear">Outerwear</option>
              <option value="shoes">Shoes</option>
              <option value="accessories">Accessories</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Brand</label>
            <input type="text" id="edit-brand" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Color</label>
            <input type="text" id="edit-color" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Size</label>
            <input type="text" id="edit-size" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Price</label>
            <input type="text" id="edit-price" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Material</label>
            <input type="text" id="edit-material" class="form-input" />
          </div>
        </div>
      </div>
      
      <div class="modal-actions">
        <button id="edit-details-btn" class="btn-edit">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
          Edit Details
        </button>
        <button id="save-details-btn" class="btn-save hidden">Save Changes</button>
        <button id="cancel-edit-btn" class="btn-cancel hidden">Cancel</button>
      </div>
    </div>
  </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <svg id="empty-icon" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
        <p id="empty-title" class="empty-title">No items found</p>
        <p id="empty-message" class="empty-message">Add your first clothing item to get started!</p>
      </div>
    </div>
  </div>

  <!-- Add Item Modal -->
  <div id="add-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Add New Item</h2>
        <button id="close-modal-btn" class="close-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <!-- Add Method Tabs -->
      <div class="method-tabs">
        <button id="upload-tab" class="method-tab active">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          Upload
        </button>
        <button id="url-tab" class="method-tab">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          URL
        </button>
      </div>

      <!-- Upload Input -->
      <div id="upload-input" class="form-group">
        <label class="form-label">Upload Image</label>
        <input type="file" id="file-input" accept="image/*" class="form-input"/>
      </div>

      <!-- URL Input -->
      <div id="url-input" class="form-group hidden">
        <label class="form-label">Image URL</label>
        <input type="url" id="url-text-input" placeholder="https://example.com/image.jpg" class="form-input"/>
      </div>

      <!-- Image Preview -->
      <div id="image-preview" class="image-preview hidden">
        <img id="preview-img" src="" alt="Preview" class="preview-img" />
      </div>

      <!-- Section Tabs -->
      <div class="section-tabs">
        <button id="details-tab" class="section-tab active">Item Details</button>
        <button id="name-tab" class="section-tab">Item Name</button>
      </div>

      <!-- Item Details Section -->
      <div id="details-section" class="form-section">
        <!-- Brand -->
        <div class="form-group">
          <label class="form-label">Brand</label>
          <div class="combo-select">
            <select id="brand-select" class="form-select combo-dropdown">
              <option value="">Select or type brand...</option>
              <option value="Nike">Nike</option>
              <option value="Adidas">Adidas</option>
              <option value="Zara">Zara</option>
              <option value="H&M">H&M</option>
              <option value="Uniqlo">Uniqlo</option>
              <option value="Gap">Gap</option>
              <option value="Levi's">Levi's</option>
              <option value="Ralph Lauren">Ralph Lauren</option>
              <option value="Tommy Hilfiger">Tommy Hilfiger</option>
              <option value="Gucci">Gucci</option>
              <option value="Prada">Prada</option>
              <option value="Louis Vuitton">Louis Vuitton</option>
              <option value="Calvin Klein">Calvin Klein</option>
              <option value="Banana Republic">Banana Republic</option>
              <option value="J.Crew">J.Crew</option>
              <option value="Forever 21">Forever 21</option>
              <option value="ASOS">ASOS</option>
              <option value="Mango">Mango</option>
              <option value="Other">Other (type below)</option>
            </select>
            <input type="text" id="brand-custom" class="form-input combo-input hidden" placeholder="Enter brand name..."/>
          </div>
        </div>

        <!-- Color -->
        <div class="form-group">
          <label class="form-label">Color</label>
          <div class="combo-select">
            <select id="color-select" class="form-select combo-dropdown">
              <option value="">Select or type color...</option>
              <option value="Black">Black</option>
              <option value="White">White</option>
              <option value="Gray">Gray</option>
              <option value="Navy">Navy</option>
              <option value="Blue">Blue</option>
              <option value="Red">Red</option>
              <option value="Green">Green</option>
              <option value="Yellow">Yellow</option>
              <option value="Orange">Orange</option>
              <option value="Pink">Pink</option>
              <option value="Purple">Purple</option>
              <option value="Brown">Brown</option>
              <option value="Beige">Beige</option>
              <option value="Cream">Cream</option>
              <option value="Burgundy">Burgundy</option>
              <option value="Olive">Olive</option>
              <option value="Teal">Teal</option>
              <option value="Multi-color">Multi-color</option>
              <option value="Other">Other (type below)</option>
            </select>
            <input type="text" id="color-custom" class="form-input combo-input hidden" placeholder="Enter color..."/>
          </div>
        </div>

        <!-- Size -->
        <div class="form-group">
          <label class="form-label">Size</label>
          <div class="combo-select">
            <select id="size-select" class="form-select combo-dropdown">
              <option value="">Select or type size...</option>
              <option value="XXS">XXS</option>
              <option value="XS">XS</option>
              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
              <option value="XXL">XXL</option>
              <option value="XXXL">XXXL</option>
              <option value="0">0</option>
              <option value="2">2</option>
              <option value="4">4</option>
              <option value="6">6</option>
              <option value="8">8</option>
              <option value="10">10</option>
              <option value="12">12</option>
              <option value="14">14</option>
              <option value="One Size">One Size</option>
              <option value="Other">Other (type below)</option>
            </select>
            <input type="text" id="size-custom" class="form-input combo-input hidden" placeholder="Enter size..."/>
          </div>
        </div>

        <!-- Price -->
        <div class="form-group">
          <label class="form-label">Price</label>
          <div class="combo-select">
            <select id="price-select" class="form-select combo-dropdown">
              <option value="">Select or type price...</option>
              <option value="$0-25">$0 - $25</option>
              <option value="$25-50">$25 - $50</option>
              <option value="$50-100">$50 - $100</option>
              <option value="$100-200">$100 - $200</option>
              <option value="$200-500">$200 - $500</option>
              <option value="$500+">$500+</option>
              <option value="Other">Other (type below)</option>
            </select>
            <input type="text" id="price-custom" class="form-input combo-input hidden" placeholder="Enter price (e.g., $75)..."/>
          </div>
        </div>

        <!-- Material -->
        <div class="form-group">
          <label class="form-label">Material</label>
          <div class="combo-select">
            <select id="material-select" class="form-select combo-dropdown">
              <option value="">Select or type material...</option>
              <option value="Cotton">Cotton</option>
              <option value="Polyester">Polyester</option>
              <option value="Denim">Denim</option>
              <option value="Wool">Wool</option>
              <option value="Linen">Linen</option>
              <option value="Silk">Silk</option>
              <option value="Leather">Leather</option>
              <option value="Suede">Suede</option>
              <option value="Cashmere">Cashmere</option>
              <option value="Nylon">Nylon</option>
              <option value="Rayon">Rayon</option>
              <option value="Velvet">Velvet</option>
              <option value="Fleece">Fleece</option>
              <option value="Cotton Blend">Cotton Blend</option>
              <option value="Synthetic">Synthetic</option>
              <option value="Other">Other (type below)</option>
            </select>
            <input type="text" id="material-custom" class="form-input combo-input hidden" placeholder="Enter material..."/>
          </div>
        </div>
      </div>

      <!-- Item Name Section -->
      <div id="name-section" class="form-section hidden">
        <!-- Item Name -->
        <div class="form-group">
          <label class="form-label">Item Name</label>
          <input type="text" id="item-name-input" placeholder="e.g., Blue Denim Jacket" class="form-input"/>
        </div>

        <!-- Category -->
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="category-input" class="form-select">
            <option value="tops">Tops</option>
            <option value="bottoms">Bottoms</option>
            <option value="dresses">Dresses</option>
            <option value="outerwear">Outerwear</option>
            <option value="shoes">Shoes</option>
            <option value="accessories">Accessories</option>
          </select>
        </div>
      </div>

      <!-- Actions -->
      <div class="modal-actions">
        <button id="cancel-btn" class="btn-cancel">Cancel</button>
        <button id="save-item-btn" class="btn-save">Add Item</button>
      </div>
    </div>
  </div>

  <div id="edit-outfit-modal" class="modal-overlay hidden">
    <div class="modal-content edit-outfit-modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Edit Outfit</h2>
        <button id="close-edit-outfit-modal-btn" class="close-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      
      <div class="edit-outfit-body">
        <!-- Outfit Name -->
        <div class="form-group">
          <label class="form-label">Outfit Name</label>
          <input type="text" id="edit-outfit-name" class="form-input" placeholder="My Awesome Outfit" />
        </div>
        
        <!-- Cover Image Section -->
        <div class="cover-image-section">
          <h3 class="section-title" style="margin: 0; font-size: 16px; color: #2a7f62;">Cover Image</h3>
          <div id="cover-image-preview" class="cover-image-preview empty">
            No cover image
          </div>
          <div class="cover-image-actions">
            <label for="outfit-cover-input" class="cover-upload-label">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
              Upload Cover
            </label>
            <input type="file" id="outfit-cover-input" class="cover-upload-input" accept="image/*" />
            <button id="remove-cover-btn" class="remove-cover-btn" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              Remove
            </button>
          </div>
        </div>
        
        <!-- Current Items in Outfit -->
        <div class="editing-section">
          <h3 class="section-title">Current Items</h3>
          <div id="editing-outfit-items" class="editing-outfit-items-grid">
            <!-- Items will be rendered here -->
          </div>
        </div>
        
        <!-- Available Wardrobe Items -->
        <div class="editing-section">
          <h3 class="section-title">Add Items from Wardrobe</h3>
          <input 
            type="text" 
            id="edit-outfit-search" 
            class="form-input" 
            placeholder="Search wardrobe items..." 
            style="margin-bottom: 15px;"
          />
          <div id="available-wardrobe-items" class="available-items-grid">
            <!-- Available items will be rendered here -->
          </div>
        </div>
      </div>
      
      <div class="modal-actions">
        <button id="cancel-edit-outfit-btn" class="btn-cancel">Cancel</button>
        <button id="save-edit-outfit-btn" class="btn-save">Save Changes</button>
      </div>
    </div>
  </div>

  <script type="module" src="/assets/js/pages/page-defaults.js"></script>
  <script type="module" src="/assets/js/pages/virtual-wardrobe.js"></script>
  <script type="module" src="/assets/js/components/load-user.js"></script>
</body>
</html>
