<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - PutOn</title>
  <link rel="stylesheet" href="/assets/css/profile.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Profile Section -->
        <div class="profile-section">
            <!-- Profile Header -->
            <div class="profile-header">
                <div class="profile-pic-container">
                    <img id="profilePic" src="" alt="Profile" class="profile-pic">
                </div>
                <div class="profile-info">
                    <div class="profile-name-row">
                        <h1 class="profile-name" id="profileName">Loading...</h1>
                        <button class="follow-btn" id="followBtn" style="display: none;">Follow</button>
                        <button class="edit-profile-btn" id="editProfileBtn" style="display: none;">
                            <a href="/pages/account-settings.html">Edit Profile</a>
                        </button>
                    </div>
                    <p class="profile-username" id="profileUsername">@username</p>
                    <p class="profile-bio" id="profileBio"></p>
                    <p class="profile-location" id="profileLocation"></p>
                    
                    <div class="profile-stats">
                        <div class="stat">
                            <span class="stat-value" id="followingCount">0</span>
                            <span class="stat-label">Following</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value" id="followersCount">0</span>
                            <span class="stat-label">Followers</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value" id="postsCount">0</span>
                            <span class="stat-label">Posts</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Posts Toggle -->
            <div class="posts-toggle">
                <button class="active" data-tab="posts">Posts</button>
                <button data-tab="liked">Liked</button>
                <button data-tab="saved">Saved</button>
                <button data-tab="reposted">Reposted</button>
            </div>

            <!-- Posts Grid -->
            <div class="posts-grid" id="postsGrid">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading posts...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="edit-post-modal" id="editPostModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Post</h2>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>

            <div class="modal-body">
                <div class="loading" id="editLoading">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>

                <div id="editFormContent" style="display: none;">
                    <div class="post-preview">
                        <img id="editPostImage" src="" alt="Post preview">
                    </div>

                    <div class="wardrobe-section-edit">
                        <h3>Tagged Wardrobe Items</h3>
                        <div class="wardrobe-items-grid" id="editWardrobeGrid">
                            <!-- Wardrobe items will be loaded here -->
                        </div>
                    </div>

                    <div class="form-section">
                        <label for="editCaption">Caption</label>
                        <textarea id="editCaption" placeholder="Describe your outfit..."></textarea>
                    </div>

                    <div class="tags-section">
                        <h3>Style Tags</h3>
                        
                        <div class="tag-category">
                            <h4>Gender</h4>
                            <div class="tag-options" id="editGenderTags">
                                <div class="tag-option" data-tag="Men">Men</div>
                                <div class="tag-option" data-tag="Women">Women</div>
                            </div>
                        </div>

                        <div class="tag-category">
                            <h4>Style</h4>
                            <div class="tag-options" id="editStyleTags">
                                <div class="tag-option" data-tag="Streetwear">Streetwear</div>
                                <div class="tag-option" data-tag="Date night">Date Night</div>
                                <div class="tag-option" data-tag="Beach">Beach</div>
                                <div class="tag-option" data-tag="Stockholm">Stockholm</div>
                                <div class="tag-option" data-tag="Old money">Old Money</div>
                                <div class="tag-option" data-tag="Gymwear">Gymwear</div>
                                <div class="tag-option" data-tag="Comfortable">Comfortable</div>
                            </div>
                        </div>

                        <div class="tag-category">
                            <h4>Season</h4>
                            <div class="tag-options" id="editSeasonTags">
                                <div class="tag-option" data-tag="Winter">Winter</div>
                                <div class="tag-option" data-tag="Spring">Spring</div>
                                <div class="tag-option" data-tag="Summer">Summer</div>
                                <div class="tag-option" data-tag="Fall">Fall</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-save" id="saveEditBtn" onclick="savePostEdit()">Save Changes</button>
            </div>
        </div>
    </div>

        <!-- View Post Modal -->
    <div class="view-post-modal" id="viewPostModal">
        <div class="view-modal-content">
            <div class="view-modal-left">
                <img id="viewPostImage" src="" alt="Post">
            </div>
            <div class="view-modal-right">
                <div class="view-modal-header">
                    <h3>Post Details</h3>
                    <button class="close-view-btn" onclick="closeViewModal()">&times;</button>
                </div>
                <div class="view-modal-body" id="viewModalBody">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/assets/js/pages/page-defaults.js"></script>
    <script type="module" src="/assets/js/components/load-user.js"></script>
    <script type="module" src="/assets/js/pages/profile.js"></script>
</body>
</html>
